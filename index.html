:root{font-family:system-ui,-apple-system,sans-serif;color:#243247;background:#f5f6f9}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#263c61,#607ea9);color:white;padding:24px max(18px,env(safe-area-inset-left));}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.85}.wrap{max-width:920px;margin:auto;padding:18px 15px 95px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:0;z-index:5;background:#f5f6f9;padding:9px 0}.nav button{border:0;background:transparent;padding:11px 3px;border-bottom:3px solid transparent;font-size:12px;color:#657086}.nav .on{border-color:#345e9e;color:#244b87;font-weight:700}.card{background:white;border:1px solid #e2e6ee;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #22344c08}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#697588}.small{font-size:13px}.big{font-size:28px;font-weight:700}.btn{border:1px solid #d5dce8;background:white;color:#273f63;padding:10px 13px;border-radius:11px}.primary{background:#345e9e;color:white;border-color:#345e9e}.btn:disabled{opacity:.45}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip.on{background:#e4ecfb;border-color:#345e9e}.sentence{display:block;width:100%;text-align:left;padding:13px 10px;background:white;border:0;border-bottom:1px solid #edf0f5;line-height:1.65;color:#263347}.sentence.on{background:#edf3ff;border-radius:10px}.han{font-size:58px}.pinyin{color:#536a94}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid #e2e6ee;border-radius:12px;padding:13px;background:#fff;text-align:left}.tile b{display:block;margin:5px 0}.progress{height:8px;border-radius:10px;background:#e9edf4;overflow:hidden}.progress span{display:block;height:100%;background:#608ac7}canvas{width:100%;max-width:420px;aspect-ratio:1;background:#fff;border:1px solid #d8e0ed;border-radius:12px;touch-action:none}.hide{display:none!important}.prompt{padding:15px;background:#f0f4fb;border-radius:12px}.word{font-size:22px;font-weight:650}select{border:1px solid #d7dfeb;border-radius:9px;background:white;padding:8px;max-width:100%}textarea{width:100%;min-height:75px;border:1px solid #d7dfeb;border-radius:10px;padding:12px;font:inherit}.label{font-size:12px;letter-spacing:.07em;font-weight:700;color:#72819b;text-transform:uppercase}footer{text-align:center;color:#7c8798;font-size:12px;padding:20px}@media(max-width:540px){.grid{grid-template-columns:1fr}.nav button{font-size:11px}.wrap{padding:12px 12px 90px}header{padding:19px 16px}.row.wraprow{flex-wrap:wrap}}
.syncbar{max-width:920px;margin:12px auto 0;padding:12px 15px;background:#fff;border:1px solid #dce4ef;border-radius:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.syncbar .status{font-size:13px;color:#52637c}.syncbar button{background:#345e9e;color:#fff;border:0;border-radius:10px;padding:10px 14px}.syncbar button:disabled{opacity:.5}</style><style id="blue-v3">body{background:#eff6fc;color:#29445c}header{background:#d9eaf8;color:#294d70}header h1{color:#294d70}header p{color:#476783}.card,.syncbar{border-radius:22px;border:1px solid #d5e5f2;background:#fff;box-shadow:0 3px 0 #dce9f4}.nav{grid-template-columns:repeat(auto-fit,minmax(82px,1fr))!important;gap:5px}.nav button{border-radius:14px;background:#fff;color:#45647e}.nav .on,.chip.on{background:#d9eaf8;color:#234f79}.btn{border-radius:12px;margin:3px;white-space:normal}.primary,.syncbar button{background:#477ca9!important;color:white!important}.tile{border-radius:22px;background:#e1effa!important;color:#29445c}.tile[data-open-lang]:before{display:block;font-size:32px}.tile[data-open-lang=en]:before{content:'🦊'}.tile[data-open-lang=es]:before{content:'🐱'}.tile[data-open-lang=de]:before{content:'🐻'}.tile[data-open-lang=zh]:before{content:'🐼'}.g3{padding:12px;border-bottom:1px solid #dce9f4}.g3 summary{cursor:pointer}.prompt{background:#edf5fc}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}input#g3search{padding:12px;width:100%;border:1px solid #c9deef;border-radius:12px}@media(max-width:600px){.nav{grid-template-columns:repeat(3,minmax(0,1fr))!important}.card{padding:14px}}</style></head><body><header><div style="max-width:920px;margin:auto"><div class="small">READ · LISTEN · SPEAK · WRITE</div><h1>🌍 LingoStories</h1><p>Learn English, Spanish, Chinese & German — at your own pace</p></div></header><section class="syncbar" aria-label="Firebase sync"><div><b>☁️ Learning progress sync</b><div class="status" id="syncStatus" role="status">Connecting to Firebase…</div></div><div><button id="googleLogin" type="button" disabled>Sign in with Google</button> <button id="googleLogout" type="button" hidden>Sign out</button></div></section><main class="wrap"><nav class="nav" id="nav"><button data-page="home" class="on">🏠<br>Home</button><button data-page="read">📖<br>Stories</button><button data-page="speak">🎙️<br>Speaking</button><button data-page="write">✍️<br>Chinese writing</button><button data-page="progress">📊<br>Progress</button></nav><div id="app"></div><footer>LingoStories · Your personal language-learning space · Progress syncs when you sign in</footer></main><script>
const DB={en:{name:'English',flag:'🇬🇧',locale:'en-US',stories:[{title:'The Mysterious Notebook',level:'B1',lines:[['On a rainy morning, Maya found a notebook on the bus.','Vào một sáng mưa, Maya tìm thấy một cuốn sổ trên xe buýt.'],['There was no name on the cover, only a tiny drawing of a blue door.','Không có tên trên bìa, chỉ có hình vẽ một cánh cửa xanh nhỏ.'],['She opened it and read a surprising sentence.','Cô mở ra và đọc được một câu đáng ngạc nhiên.'],['“If you are reading this, you have already found the first clue.”','“Nếu bạn đang đọc điều này, bạn đã tìm thấy manh mối đầu tiên.”'],['Maya looked up, but the bus was almost empty.','Maya ngẩng lên, nhưng xe buýt gần như trống không.']],question:'What was drawn on the notebook?',answers:['A blue door','A red tree','A small cat'],correct:0},{title:'A Different Saturday',level:'B1',lines:[['Leo had planned to stay home and do nothing.','Leo đã định ở nhà và không làm gì cả.'],['Then his neighbor invited him to a small art exhibition.','Sau đó hàng xóm mời anh đến một triển lãm nghệ thuật nhỏ.'],['He almost said no, but decided to go.','Anh suýt từ chối, nhưng rồi quyết định đi.'],['One painting reminded him of a place he had visited as a child.','Một bức tranh khiến anh nhớ tới nơi từng đến hồi nhỏ.'],['By the end of the day, he had made a new friend.','Cuối ngày, anh đã có thêm một người bạn mới.']],question:'Where did Leo go?',answers:['To the cinema','To an art exhibition','To a restaurant'],correct:1}]},es:{name:'Spanish',flag:'🇪🇸',locale:'es-ES',stories:[{title:'El cuaderno perdido',level:'A2–B1',lines:[['Una mañana de lluvia, Ana encontró un cuaderno en el autobús.','Một sáng mưa, Ana tìm thấy một cuốn sổ trên xe buýt.'],['En la portada había un dibujo de una puerta azul.','Trên bìa có hình vẽ một cánh cửa xanh.'],['Ana abrió el cuaderno y leyó la primera página.','Ana mở cuốn sổ và đọc trang đầu tiên.'],['«Todo empieza con una pequeña pregunta», decía.','“Mọi chuyện bắt đầu bằng một câu hỏi nhỏ”, dòng chữ viết.'],['Ana decidió buscar al dueño del cuaderno.','Ana quyết định tìm chủ nhân cuốn sổ.']],question:'¿Qué había en la portada?',answers:['Una puerta azul','Un árbol rojo','Un gato negro'],correct:0},{title:'Un sábado diferente',level:'A2–B1',lines:[['Pablo quería quedarse en casa el sábado.','Pablo muốn ở nhà vào thứ Bảy.'],['Su amiga lo invitó a una exposición de arte.','Bạn anh mời anh đến một triển lãm nghệ thuật.'],['Al principio, Pablo no quería ir.','Ban đầu Pablo không muốn đi.'],['Pero vio un cuadro precioso y empezó a sonreír.','Nhưng anh thấy một bức tranh rất đẹp và bắt đầu mỉm cười.'],['Al final, pasó una tarde maravillosa.','Cuối cùng anh đã có một buổi chiều tuyệt vời.']],question:'¿Adónde fue Pablo?',answers:['A la escuela','A una exposición','Al hospital'],correct:1}]},de:{name:'German',flag:'🇩🇪',locale:'de-DE',stories:[{title:'Ein Brief im Café',level:'A1–A2',lines:[['Jeden Morgen geht Lena in ein kleines Café.','Mỗi sáng Lena đến một quán cà phê nhỏ.'],['Heute liegt ein Brief auf ihrem Tisch.','Hôm nay có một lá thư trên bàn của cô.'],['Auf dem Umschlag steht kein Name.','Trên phong bì không có tên.'],['Lena öffnet den Brief und liest eine kurze Nachricht.','Lena mở thư và đọc một lời nhắn ngắn.'],['„Komm morgen wieder. Ich habe eine Überraschung für dich.“','“Ngày mai hãy quay lại. Tôi có một bất ngờ dành cho bạn.”']],question:'Was findet Lena auf dem Tisch?',answers:['Einen Brief','Ein Handy','Eine Blume'],correct:0},{title:'Ein unerwarteter Ausflug',level:'A2–B1',lines:[['Am Samstag wollte Jonas eigentlich zu Hause bleiben.','Thứ Bảy Jonas vốn định ở nhà.'],['Seine Freundin fragte ihn, ob er mit ins Museum kommen möchte.','Bạn anh hỏi liệu anh có muốn cùng đến bảo tàng không.'],['Zuerst hatte er keine Lust, aber dann sagte er doch zu.','Ban đầu anh không hứng thú, nhưng cuối cùng vẫn đồng ý.'],['Im Museum entdeckte er ein Bild aus seiner Heimatstadt.','Ở bảo tàng, anh phát hiện một bức tranh về quê mình.'],['Plötzlich erinnerte er sich an einen besonderen Tag aus seiner Kindheit.','Bỗng anh nhớ đến một ngày đặc biệt thời thơ ấu.']],question:'Wohin geht Jonas?',answers:['Ins Kino','Ins Museum','In die Bibliothek'],correct:1}]},zh:{name:'Chinese',flag:'🇨🇳',locale:'zh-CN',stories:[{title:'我的一天',level:'Beginner',lines:[['你好！','Xin chào!','Nǐ hǎo!'],['我叫小明。','Tôi tên là Tiểu Minh.','Wǒ jiào Xiǎomíng.'],['今天我去学校。','Hôm nay tôi đến trường.','Jīntiān wǒ qù xuéxiào.'],['我喜欢看书。','Tôi thích đọc sách.','Wǒ xǐhuan kàn shū.'],['晚上我回家。','Buổi tối tôi về nhà.','Wǎnshang wǒ huí jiā.']],question:'小明喜欢做什么？',answers:['看书','喝茶','跑步'],correct:0},{title:'去书店',level:'HSK 1–2',lines:[['今天我去书店。','Hôm nay tôi đến hiệu sách.','Jīntiān wǒ qù shūdiàn.'],['书店里有很多书。','Trong hiệu sách có nhiều sách.','Shūdiàn lǐ yǒu hěn duō shū.'],['我想买一本中文书。','Tôi muốn mua một cuốn sách tiếng Trung.','Wǒ xiǎng mǎi yì běn Zhōngwén shū.'],['这本书很好看。','Cuốn sách này rất hay.','Zhè běn shū hěn hǎokàn.'],['我买了书，然后回家。','Tôi mua sách rồi về nhà.','Wǒ mǎi le shū, ránhòu huí jiā.']],question:'他想买什么？',answers:['一本中文书','一杯水','一张票'],correct:0}]}},CHARS=[{c:'一',p:'yī',v:'one',strokes:'1 horizontal stroke, left to right'},{c:'二',p:'èr',v:'two',strokes:'2 horizontal strokes, top first'},{c:'三',p:'sān',v:'three',strokes:'3 horizontal strokes, top to bottom'},{c:'十',p:'shí',v:'ten',strokes:'horizontal first, then vertical'},{c:'人',p:'rén',v:'person',strokes:'left-falling stroke, then right-falling stroke'},{c:'口',p:'kǒu',v:'mouth',strokes:'left vertical; top/right corner; bottom horizontal'},{c:'大',p:'dà',v:'big',strokes:'horizontal; left-falling; right-falling'},{c:'小',p:'xiǎo',v:'small',strokes:'center vertical hook; left dot; right dot'}];
let state={page:'home',lang:'en',story:0,seen:{en:[],es:[],zh:[],de:[]},completed:{en:[],es:[],zh:[],de:[]},saved:[],showTranslation:false,showPinyin:true,character:0,minutes:45,practice:0,notes:[],xp:0};try{state={...state,...JSON.parse(localStorage.getItem('trilingo-stories-v2')||'{}')}}catch{};for(const k of Object.keys(DB)){if(!Array.isArray(state.seen?.[k])){state.seen=state.seen||{};state.seen[k]=[]}if(!Array.isArray(state.completed?.[k])){state.completed=state.completed||{};state.completed[k]=[]}}if(!DB[state.lang])state.lang='en';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem('trilingo-stories-v2',JSON.stringify(state))}catch{};window.dispatchEvent(new Event('lingo-local-change'))}function set(p){Object.assign(state,p);persist();render()}function speech(t,rate=.85){if(!('speechSynthesis'in window))return alert('Text-to-speech is not supported by this browser.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=DB[state.lang].locale;u.rate=rate;speechSynthesis.speak(u)}function langChips(){return '<div class="chips">'+Object.keys(DB).map(k=>`<button class="btn chip ${k===state.lang?'on':''}" data-lang="${k}">${DB[k].flag} ${DB[k].name}</button>`).join('')+'</div>'}function current(){return DB[state.lang].stories[state.story]}function count(){return Object.values(state.completed).reduce((n,x)=>n+x.length,0)}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===state.page));app.innerHTML=({home:home,read:read,speak:speak,write:write,progress:progress}[state.page])();if(state.page==='write')setupCanvas()}
function home(){const d=new Date().getDay(),rot=['de','zh','es','de','zh','es','de'][d],en=Math.round(state.minutes/3);return `<div class="card"><div class="label">Today</div><h2 style="margin:8px 0">Learn at your own pace</h2><div class="row wraprow"><span>Daily study time</span><select id="minutes">${[30,45,60].map(n=>`<option ${state.minutes===n?'selected':''} value="${n}">${n} min</option>`).join('')}</select></div><p>🇬🇧 English: <b>${en} min</b> · ${DB[rot].flag} ${DB[rot].name}: <b>${state.minutes-en} min</b></p><button class="btn primary" data-page="read">Start reading →</button></div><div class="grid">${Object.entries(DB).map(([k,v])=>`<button class="tile" data-open-lang="${k}"><div style="font-size:27px">${v.flag}</div><b>${v.name}</b><span class="small muted">${k==='en'?'Read & shadow':k==='es'?'Read & speak':k==='zh'?'Pinyin · reading · writing':'Read & shadow'}</span><p class="small">${state.completed[k].length}/${v.stories.length} stories completed</p></button>`).join('')}</div><div class="card"><b>Progress</b><p>⭐ ${state.xp} XP · 📚 ${count()} stories · 🔖 ${state.saved.length} saved sentences</p><p class="muted small">Your lessons and progress are saved on this device. Sign in to sync them.</p></div>`}
function read(){let s=current(),seen=state.seen[state.lang]||[],isDone=state.completed[state.lang].includes(state.story);return `${langChips()}<div class="card"><div class="row wraprow"><div><div class="label">Story library</div><h2 style="margin:5px 0">${esc(s.title)}</h2><div class="small muted">${esc(s.level)} · ${s.lines.length} sentences</div></div><select id="storySelect">${DB[state.lang].stories.map((v,i)=>`<option value="${i}" ${i===state.story?'selected':''}>Story ${i+1}: ${esc(v.title)}</option>`).join('')}</select></div><p class="small muted">Read ${seen.length}/${s.lines.length} sentences ${isDone?'· ✓ Completed':''}</p><div class="progress"><span style="width:${seen.length/s.lines.length*100}%"></span></div><div class="chips" style="margin-top:12px"><button class="btn" id="toggleTranslation">${state.showTranslation?'✓':'○'} Translation</button>${state.lang==='zh'?`<button class="btn" id="togglePinyin">${state.showPinyin?'✓':'○'} Pinyin</button>`:''}<button class="btn" id="listenAll">🔊 Listen to story</button></div></div><div class="card"><div class="label">Tap a sentence to listen and see its meaning</div>${s.lines.map((l,i)=>`<button class="sentence" data-line="${i}"><span class="muted small">${i+1}. </span><span class="${state.lang==='zh'?'word':''}">${esc(l[0])}</span>${state.lang==='zh'&&state.showPinyin?`<div class="pinyin small">${esc(l[2])}</div>`:''}${state.showTranslation?`<div class="small muted">${esc(l[1])}</div>`:''}</button>`).join('')}</div><div id="detail"></div><div class="card"><h3>Reading comprehension</h3><p>${esc(s.question)}</p>${s.answers.map((a,i)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:7px 0" data-answer="${i}">${esc(a)}</button>`).join('')}<div id="feedback" class="small"></div></div>`}
function speak(){let lines=DB[state.lang].stories[state.story].lines,i=state.practice%lines.length,l=lines[i];return `${langChips()}<div class="card"><div class="label">${state.lang==='es'?'Spanish speaking practice':state.lang==='en'?'English shadowing':state.lang==='de'?'German shadowing & speaking':'Chinese listen & repeat'}</div><h2>${['es','de'].includes(state.lang)?'Listen · respond · repeat':'Listen · repeat · practice rhythm'}</h2><p class="muted small">Sentence ${i+1}/${lines.length} · ${esc(current().title)}</p><div class="prompt"><div class="word">${esc(l[0])}</div>${state.lang==='zh'?`<p class="pinyin">${esc(l[2])}</p>`:''}<div class="muted small">${esc(l[1])}</div></div><div class="chips" style="margin-top:12px"><button class="btn" id="listenSlow">🔊 Slow 0.7×</button><button class="btn" id="listenNormal">🔊 Normal speed</button><button class="btn" id="speakTry">🎙️ Try speaking</button></div><p id="spoken" class="muted small">Listen and repeat. Microphone support depends on your browser and permissions.</p><div class="row"><button class="btn" id="prevPractice">← Previous</button><button class="btn primary" id="nextPractice">Next sentence →</button></div></div>${['es','de'].includes(state.lang)?`<div class="card"><h3>Free speaking practice</h3><p>${state.lang==='de'?'Was hast du heute gemacht? — What did you do today?':'¿Qué hiciste hoy? — What did you do today?'}</p><p class="muted small">Try answering aloud before revealing the example.</p><button class="btn" id="showExample">Show example answer</button><p id="example" class="hide">${state.lang==='de'?'Heute habe ich gearbeitet und danach eine Geschichte gelesen.':'Hoy he trabajado un poco y después he leído una historia.'}</p></div>`:''}`}
let strokes=[],currentStroke=null,showGuide=true;function write(){let h=CHARS[state.character];return `<div class="card"><div class="label">Chinese from scratch</div><h2>Practice Chinese characters</h2><p class="muted small">Lesson ${state.character+1}/${CHARS.length} · Simplified Chinese · Use your finger or Apple Pencil</p><div class="row"><div><div class="han">${h.c}</div><b>${h.p}</b> · ${h.v}</div><div style="max-width:60%"><b>Stroke order</b><p class="small muted">${h.strokes}</p><button class="btn" id="hearHan">🔊 Listen</button></div></div><p class="small">Practice writing in the box:</p><canvas id="ink" width="500" height="500"></canvas><div class="chips" style="margin-top:12px"><button class="btn" id="clearInk">Clear strokes</button><button class="btn" id="toggleGuide">${showGuide?'Hide':'Show'} guide</button><button class="btn primary" id="nextChar">Next character →</button></div><p class="muted small">This version supports handwriting and text-based stroke guidance, but not stroke animation or automatic scoring.</p></div><div class="card"><h3>Pinyin basics & four tones</h3><p>Tap each syllable to hear the tone.</p><div class="chips">${[['mā','Tone 1: high and level'],['má','Tone 2: rising'],['mǎ','Tone 3: falling then rising'],['mà','Tone 4: sharp falling']].map(([t,n])=>`<button class="btn" data-tone="${t}" title="${n}">${t}</button>`).join('')}</div><p id="toneExplain" class="small muted">You will also learn the neutral tone in later lessons.</p></div>`}
function progress(){return `<div class="card"><h2>Learning progress</h2><p>⭐ ${state.xp} XP · ${count()} stories completed</p>${Object.entries(DB).map(([k,v])=>`<div style="margin:18px 0"><div class="row"><b>${v.flag} ${v.name}</b><span class="small">${state.completed[k].length}/${v.stories.length} stories</span></div><div class="progress"><span style="width:${state.completed[k].length/v.stories.length*100}%"></span></div></div>`).join('')}</div><div class="card"><h3>🔖 Saved sentences (${state.saved.length})</h3>${state.saved.length?state.saved.map((x,i)=>`<div style="border-bottom:1px solid #edf0f5;padding:10px 0"><b>${esc(x.text)}</b><div class="small muted">${esc(x.meaning)}</div><button class="btn small" data-remove="${i}">Remove</button></div>`).join(''):'<p class="muted">No saved sentences yet.</p>'}</div><div class="card"><h3>Backup & transfer data</h3><p class="small muted">Export your data here and import it on another device. This is a manual backup, not automatic syncing.</p><div class="chips"><button class="btn" id="exportData">⬇ Export data</button><label class="btn" for="importData">⬆ Import data</label><input type="file" id="importData" accept="application/json" class="hide"></div></div>`}
function setupCanvas(){const c=document.getElementById('ink');if(!c)return;const x=c.getContext('2d');function paint(){x.fillStyle='#fff';x.fillRect(0,0,500,500);x.strokeStyle='#d6dce6';x.lineWidth=1;x.setLineDash([7,7]);x.beginPath();x.moveTo(250,0);x.lineTo(250,500);x.moveTo(0,250);x.lineTo(500,250);x.stroke();x.setLineDash([]);if(showGuide){x.fillStyle='#e5e9f0';x.font='340px "Noto Sans CJK SC","Microsoft YaHei",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(CHARS[state.character].c,250,252)}x.strokeStyle='#273f63';x.lineWidth=12;x.lineJoin='round';x.lineCap='round';for(const stroke of strokes){if(!stroke.length)continue;x.beginPath();x.moveTo(...stroke[0]);for(let j=1;j<stroke.length;j++)x.lineTo(...stroke[j]);if(stroke.length===1)x.lineTo(stroke[0][0]+.1,stroke[0][1]+.1);x.stroke()}}function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*500/r.width,(e.clientY-r.top)*500/r.height]}c.addEventListener('pointerdown',e=>{e.preventDefault();currentStroke=[pos(e)];strokes.push(currentStroke);c.setPointerCapture(e.pointerId);paint()});c.addEventListener('pointermove',e=>{if(!currentStroke)return;currentStroke.push(pos(e));paint()});c.addEventListener('pointerup',()=>currentStroke=null);c.addEventListener('pointercancel',()=>currentStroke=null);window.repaintInk=paint;paint()}
function showLine(i){let l=current().lines[i];let arr=state.seen[state.lang]||[];if(!arr.includes(i)){arr.push(i);state.seen[state.lang]=arr;persist()}document.querySelectorAll('[data-line]').forEach(b=>b.classList.toggle('on',+b.dataset.line===i));let d=document.getElementById('detail');d.innerHTML=`<div class="card"><div class="label">Sentence ${i+1}</div><p class="word">${esc(l[0])}</p>${l[2]?`<p class="pinyin">${esc(l[2])}</p>`:''}<p>${esc(l[1])}</p><div class="chips"><button class="btn" id="hearLine">🔊 Listen</button><button class="btn" id="saveLine">☆ Save sentence</button></div></div>`;d.dataset.line=i;speech(l[0],.8)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){set({page:b.dataset.page});return}if(b.dataset.lang){set({lang:b.dataset.lang,story:0,practice:0});return}if(b.dataset.openLang){set({lang:b.dataset.openLang,story:0,page:'read'});return}if(b.dataset.line!==undefined){showLine(+b.dataset.line);return}if(b.dataset.answer!==undefined){let s=current(),ok=+b.dataset.answer===s.correct;document.getElementById('feedback').textContent=ok?'✓ Correct!':'Not quite. Try reading the story again.';if(ok&&!state.completed[state.lang].includes(state.story)){state.completed[state.lang].push(state.story);state.xp+=30;persist()}return}if(b.dataset.tone){let names={'mā':'Tone 1: high and level','má':'Tone 2: rising','mǎ':'Tone 3: falling then rising','mà':'Tone 4: sharp falling'};document.getElementById('toneExplain').textContent=names[b.dataset.tone];speech(b.dataset.tone,.7);return}switch(b.id){case 'toggleTranslation':set({showTranslation:!state.showTranslation});break;case 'togglePinyin':set({showPinyin:!state.showPinyin});break;case 'listenAll':speech(current().lines.map(x=>x[0]).join(' '),.8);break;case 'hearLine':speech(current().lines[+document.getElementById('detail').dataset.line][0],.75);break;case 'saveLine':{let l=current().lines[+document.getElementById('detail').dataset.line];if(!state.saved.some(x=>x.lang===state.lang&&x.text===l[0])){state.saved.push({lang:state.lang,text:l[0],meaning:l[1]});state.xp+=2;persist()}b.textContent='★ Saved';break}case 'listenSlow':speech(current().lines[state.practice%current().lines.length][0],.7);break;case 'listenNormal':speech(current().lines[state.practice%current().lines.length][0],1);break;case 'nextPractice':set({practice:(state.practice+1)%current().lines.length});break;case 'prevPractice':set({practice:(state.practice-1+current().lines.length)%current().lines.length});break;case 'showExample':document.getElementById('example').classList.toggle('hide');break;case 'speakTry':{let R=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.getElementById('spoken');if(!R){el.textContent='Speech recognition is not supported on this device/browser.';break}try{let r=new R();r.lang=DB[state.lang].locale;r.onresult=v=>el.textContent='You said: '+v.results[0][0].transcript;r.onerror=()=>el.textContent='Could not recognize speech. Check microphone permissions.';el.textContent='Listening...';r.start()}catch{el.textContent='Could not access the microphone.'}break}case 'hearHan':{let u=new SpeechSynthesisUtterance(CHARS[state.character].c);u.lang='zh-CN';u.rate=.7;speechSynthesis.speak(u);break}case 'clearInk':strokes=[];window.repaintInk?.();break;case 'toggleGuide':showGuide=!showGuide;render();break;case 'nextChar':strokes=[];set({character:(state.character+1)%CHARS.length});break;case 'exportData':{let blob=new Blob([JSON.stringify({version:2,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trilingo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'savePractice':break;}});
document.addEventListener('change',e=>{if(e.target.id==='storySelect')set({story:+e.target.value,practice:0});if(e.target.id==='minutes')set({minutes:+e.target.value});if(e.target.id==='importData'){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let j=JSON.parse(t);if(j.version!==2||!j.state||!j.state.completed||!j.state.seen)throw Error('Invalid backup format');state={...state,...j.state,page:'progress'};persist();render();alert('Backup imported successfully.')}).catch(()=>alert('Could not read the backup file.'))}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script>(()=>{
const defaults={library:[],lessonDone:[],voicePrefs:{}};for(const k in defaults)if(state[k]==null)state[k]=defaults[k];
const btn=(t,a)=>`<button class="btn" data-up="${esc(a)}">${esc(t)}</button>`;
const nav=document.querySelector('#nav');nav.insertAdjacentHTML('beforeend','<button data-page="learn">📚<br>Learn</button><button data-page="library">📁<br>My Library</button><button data-page="voice">🔊<br>Voice</button>');nav.style.gridTemplateColumns='repeat(auto-fit,minmax(75px,1fr))';
const original=render;let selected='';let active=-1;let audio=null;
const groups=[['Initials','b p m f d t n l g k h j q x zh ch sh r z c s'],['Simple finals','a o e i u ü'],['Compound finals','ai ei ao ou ia ie iao iu ua uo uai ui üe'],['Nasal finals','an en ang eng ong ian in iang ing iong uan un uang üan ün'],['Spelling helpers','y w']];
const examples={b:'八',p:'趴',m:'妈',f:'发',d:'搭',t:'他',n:'拿',l:'拉',g:'哥',k:'科',h:'喝',j:'鸡',q:'七',x:'西',zh:'知',ch:'吃',sh:'诗',r:'日',z:'资',c:'次',s:'丝',a:'啊',o:'喔',e:'鹅',i:'衣',u:'乌','ü':'迂',ai:'爱',ei:'诶',ao:'奥',ou:'欧',an:'安',en:'恩',ang:'昂',eng:'鞥',ong:'东',er:'儿',y:'衣',w:'乌',ia:'呀',ie:'耶',iao:'腰',iu:'优',ua:'蛙',uo:'窝',uai:'歪',ui:'威','üe':'约',ian:'烟',in:'因',iang:'央',ing:'英',iong:'拥',uan:'弯',un:'温',uang:'汪','üan':'冤','ün':'晕'};
const tips={b:'Khép môi, bật nhẹ, không bật hơi mạnh.',p:'Khép môi rồi bật hơi mạnh.',d:'Đầu lưỡi chạm lợi, không bật hơi mạnh.',t:'Giống d về vị trí nhưng bật hơi mạnh.',j:'Mặt lưỡi trước nâng lên gần ngạc cứng, không bật hơi.',q:'Cùng vị trí với j, bật hơi mạnh.',x:'Mặt lưỡi trước gần ngạc cứng, tạo tiếng xát.',zh:'Cong đầu lưỡi lên, không bật hơi mạnh.',ch:'Cong đầu lưỡi và bật hơi mạnh.',sh:'Cong đầu lưỡi, tạo tiếng xát.',r:'Đầu lưỡi hơi cong, có tiếng hữu thanh.',z:'Đầu lưỡi gần lợi, âm tắc-xát không bật hơi.',c:'Giống z nhưng bật hơi mạnh.',s:'Đầu lưỡi gần lợi, tạo tiếng xát.','ü':'Đọc i nhưng tròn môi như u.',e:'Lưỡi lùi, môi không tròn.'};
const grammar={en:[['Present simple','Thói quen, sự thật. I work; she works.'],['Past simple','Hành động đã kết thúc. I went yesterday.'],['Present perfect','Have/has + past participle. I have finished.'],['Future','Will + nguyên thể; be going to cho dự định.'],['Conditionals','If + present, will + verb; if + past, would + verb.']],es:[['Presente','-ar: o, as, a, amos, áis, an. -er: o, es, e, emos, éis, en. -ir: o, es, e, imos, ís, en.'],['Indefinido','Sự kiện đã kết thúc: ayer hablé.'],['Imperfecto','Thói quen hoặc bối cảnh quá khứ: hablaba.'],['Subjuntivo','Mong muốn, nghi ngờ: quiero que hables.'],['Ser / estar','Ser: đặc điểm, danh tính; estar: trạng thái, vị trí.']],de:[['Präsens','Đuôi thường: -e, -st, -t, -en, -t, -en.'],['Perfekt','haben/sein + Partizip II: Ich bin gegangen.'],['Präteritum','Quá khứ kể chuyện: Ich ging.'],['Cases','Nominativ: chủ ngữ; Akkusativ: tân ngữ trực tiếp; Dativ: tân ngữ gián tiếp; Genitiv: sở hữu.'],['Word order','Động từ hữu hạn ở vị trí 2 trong câu chính; cuối mệnh đề phụ với weil.'],['Separable verbs','Ich stehe um sieben Uhr auf.']]};
const irregular={en:{go:['go','goes','went','gone'],be:['am/are','is','was/were','been'],have:['have','has','had','had'],do:['do','does','did','done'],see:['see','sees','saw','seen'],eat:['eat','eats','ate','eaten'],take:['take','takes','took','taken']},es:{ser:['soy','eres','es','somos','sois','son'],estar:['estoy','estás','está','estamos','estáis','están'],ir:['voy','vas','va','vamos','vais','van'],tener:['tengo','tienes','tiene','tenemos','tenéis','tienen'],hacer:['hago','haces','hace','hacemos','hacéis','hacen']},de:{sein:['bin','bist','ist','sind','seid','sind'],haben:['habe','hast','hat','haben','habt','haben'],gehen:['gehe','gehst','geht','gehen','geht','gehen'],werden:['werde','wirst','wird','werden','werdet','werden']}};
function learn(){if(state.lang==='zh')return langChips()+`<div class="card"><h2>Chinese from zero</h2><p>Pinyin ghi âm tiếng Quan thoại. Âm tiết thường gồm thanh mẫu, vận mẫu và thanh điệu. Không đọc theo tên chữ cái tiếng Anh.</p>${groups.map(([n,g])=>`<h3>${n}</h3><div class="chips">${g.split(' ').map(x=>btn(x,'py:'+x)).join('')}</div>`).join('')}<div id="pyDetail" class="prompt" style="margin-top:15px">Chọn một âm để xem hướng dẫn.</div><h3>Four tones + neutral tone</h3><div class="chips">${['mā','má','mǎ','mà','ma'].map((x,i)=>btn(x,'tone:'+i)).join('')}</div><p id="toneInfo"></p><p>Ghép âm: b + a = ba; m + a = ma. Dấu thanh đặt trên nguyên âm chính.</p><button class="btn" data-page="write">Practice handwriting</button></div>`;return langChips()+`<div class="card"><h2>Grammar reference</h2>${grammar[state.lang].map(([n,t])=>`<details style="padding:12px;border-bottom:1px solid #ddd"><summary><b>${n}</b></summary><p>${t}</p>${btn('Mark reviewed','done:'+n)}</details>`).join('')}<h3>Verb conjugation</h3><p class="muted">Starter reference: common irregular verbs and regular Spanish verbs.</p><input id="verb" placeholder="${state.lang==='es'?'hablar':state.lang==='de'?'gehen':'go'}" list="verbs" style="padding:10px;width:100%"><datalist id="verbs">${Object.keys(irregular[state.lang]).map(x=>`<option value="${x}">`).join('')}</datalist>${btn('Look up','verb')}<div id="verbResult"></div></div>`}
function library(){let items=state.library.map((x,i)=>({x,i})).filter(({x})=>x.lang===state.lang);return langChips()+`<div class="card"><h2>My Library</h2><input id="storyTitle" placeholder="Title" style="width:100%;padding:10px"><textarea id="storyText" placeholder="Paste your story here"></textarea><label>Import TXT <input id="txtFile" type="file" accept=".txt,text/plain"></label><p>${btn('Save story','add')}</p>${items.map(({x,i})=>`<div class="row"><b>${esc(x.title)}</b>${btn('Read','open:'+i)}${btn('Delete','del:'+i)}</div>`).join('')}</div><div id="personalStory"></div>`}
function voice(){let p=state.voicePrefs[state.lang]||{};return langChips()+`<div class="card"><h2>Voice settings</h2><p>Free device voices. Availability varies by browser.</p><select id="voiceSelect"><option value="">Automatic</option>${(window.speechSynthesis?.getVoices()||[]).filter(v=>v.lang.startsWith(DB[state.lang].locale.slice(0,2))).map(v=>`<option value="${esc(v.voiceURI)}" ${p.uri===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select><p>Speed <input id="voiceRate" type="range" min="0.5" max="1.3" step="0.05" value="${p.rate||.85}"></p>${btn('Listen to sample','sample')}<p class="muted">You can also play a local MP3 alongside your own story.</p></div>`}
render=function(){if(['learn','library','voice'].includes(state.page)){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===state.page));app.innerHTML=({learn,library,voice}[state.page])();}else original()};
const oldSpeech=speech;speech=function(t,rate){if(!window.speechSynthesis)return oldSpeech(t,rate);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),p=state.voicePrefs[state.lang]||{};u.lang=DB[state.lang].locale;u.rate=p.rate||rate||.85;let v=speechSynthesis.getVoices().find(v=>v.voiceURI===p.uri);if(v)u.voice=v;speechSynthesis.speak(u)};
function openStory(i){active=i;let x=state.library[i];let lines=x.text.match(/[^.!?。！？\n]+[.!?。！？]*/g)||[x.text];document.querySelector('#personalStory').innerHTML=`<div class="card"><h2>${esc(x.title)}</h2>${btn('Listen all','all')}${btn('Stop','stop')}<p>Original audio (local only): <input type="file" id="audioFile" accept="audio/*"><audio id="audioPlayer" controls style="width:100%"></audio></p>${lines.map((l,j)=>`<p class="sentence">${esc(l)} ${btn('🔊','line:'+j)} ${btn('Save','save:'+j)}</p>`).join('')}</div>`;window.personalLines=lines;}
document.addEventListener('click',e=>{let b=e.target.closest('[data-up]');if(!b)return;let [a,k]=b.dataset.up.split(':');if(a==='py'){document.querySelector('#pyDetail').innerHTML=`<h2>${esc(k)}</h2><p>${esc(tips[k]||'Nghe âm trong âm tiết mẫu và luyện bắt chước. Không đọc theo tên chữ cái.')}</p><p>Example: ${examples[k]||'—'} (âm tiết mẫu, không phải âm đứng riêng)</p>`;if(examples[k])speech(examples[k],.7)}if(a==='tone'){let i=+k;document.querySelector('#toneInfo').textContent=['Cao ngang','Đi lên','Hạ thấp rồi lên khi đọc riêng','Hạ nhanh','Nhẹ, ngắn'][i];speech(['妈','麻','马','骂','吗'][i],.7)}if(a==='done'){let id=state.lang+':'+k;if(!state.lessonDone.includes(id))state.lessonDone.push(id);persist();b.textContent='✓ Reviewed'}if(a==='verb'){let v=document.querySelector('#verb').value.trim().toLowerCase(),r=irregular[state.lang][v],labels=state.lang==='en'?['Base','3rd person','Past','Past participle']:state.lang==='es'?['yo','tú','él/ella','nosotros','vosotros','ellos']:['ich','du','er/sie/es','wir','ihr','sie/Sie'];if(!r&&state.lang==='es'&&/(ar|er|ir)$/.test(v)){let end=v.slice(-2),stem=v.slice(0,-2);r=({ar:['o','as','a','amos','áis','an'],er:['o','es','e','emos','éis','en'],ir:['o','es','e','imos','ís','en']}[end]).map(x=>stem+x)}document.querySelector('#verbResult').innerHTML=r?'<h4>Present / principal forms</h4>'+r.map((x,i)=>`<p>${labels[i]} — <b>${esc(x)}</b></p>`).join(''):'<p>Not in starter dictionary.</p>'}if(a==='add'){let title=document.querySelector('#storyTitle').value.trim(),text=document.querySelector('#storyText').value.trim();if(!text)return;if(text.length>50000)return alert('Maximum 50,000 characters per story.');state.library.push({title:title||'Untitled',text,lang:state.lang});persist();render()}if(a==='open')openStory(+k);if(a==='del'&&confirm('Delete this story?')){state.library.splice(+k,1);persist();render()}if(a==='all')speech(state.library[active].text);if(a==='stop')window.speechSynthesis?.cancel();if(a==='line')speech(window.personalLines[+k]);if(a==='save'){state.saved.push({lang:state.lang,text:window.personalLines[+k],meaning:''});persist();b.textContent='Saved'}if(a==='sample')speech({en:'Today is a beautiful day to learn something new.',es:'Hoy es un buen día para aprender algo nuevo.',de:'Heute ist ein guter Tag, um etwas Neues zu lernen.',zh:'你好，今天我们学习中文。'}[state.lang])});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='txtFile'&&t.files[0])document.querySelector('#storyText').value=await t.files[0].text();if(t.id==='audioFile'&&t.files[0]){if(audio)URL.revokeObjectURL(audio);audio=URL.createObjectURL(t.files[0]);document.querySelector('#audioPlayer').src=audio}if(['voiceSelect','voiceRate'].includes(t.id)){state.voicePrefs[state.lang]={uri:document.querySelector('#voiceSelect').value,rate:+document.querySelector('#voiceRate').value};persist()}});if(window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged',()=>{if(state.page==='voice')render()});render();
