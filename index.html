<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#273f63"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LingoStories"><link rel="manifest" href="manifest.webmanifest"><title>LingoStories</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243247;background:#f5f6f9}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#263c61,#607ea9);color:white;padding:24px max(18px,env(safe-area-inset-left));}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.85}.wrap{max-width:920px;margin:auto;padding:18px 15px 95px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:0;z-index:5;background:#f5f6f9;padding:9px 0}.nav button{border:0;background:transparent;padding:11px 3px;border-bottom:3px solid transparent;font-size:12px;color:#657086}.nav .on{border-color:#345e9e;color:#244b87;font-weight:700}.card{background:white;border:1px solid #e2e6ee;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #22344c08}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#697588}.small{font-size:13px}.big{font-size:28px;font-weight:700}.btn{border:1px solid #d5dce8;background:white;color:#273f63;padding:10px 13px;border-radius:11px}.primary{background:#345e9e;color:white;border-color:#345e9e}.btn:disabled{opacity:.45}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip.on{background:#e4ecfb;border-color:#345e9e}.sentence{display:block;width:100%;text-align:left;padding:13px 10px;background:white;border:0;border-bottom:1px solid #edf0f5;line-height:1.65;color:#263347}.sentence.on{background:#edf3ff;border-radius:10px}.han{font-size:58px}.pinyin{color:#536a94}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid #e2e6ee;border-radius:12px;padding:13px;background:#fff;text-align:left}.tile b{display:block;margin:5px 0}.progress{height:8px;border-radius:10px;background:#e9edf4;overflow:hidden}.progress span{display:block;height:100%;background:#608ac7}canvas{width:100%;max-width:420px;aspect-ratio:1;background:#fff;border:1px solid #d8e0ed;border-radius:12px;touch-action:none}.hide{display:none!important}.prompt{padding:15px;background:#f0f4fb;border-radius:12px}.word{font-size:22px;font-weight:650}select{border:1px solid #d7dfeb;border-radius:9px;background:white;padding:8px;max-width:100%}textarea{width:100%;min-height:75px;border:1px solid #d7dfeb;border-radius:10px;padding:12px;font:inherit}.label{font-size:12px;letter-spacing:.07em;font-weight:700;color:#72819b;text-transform:uppercase}footer{text-align:center;color:#7c8798;font-size:12px;padding:20px}@media(max-width:540px){.grid{grid-template-columns:1fr}.nav button{font-size:11px}.wrap{padding:12px 12px 90px}header{padding:19px 16px}.row.wraprow{flex-wrap:wrap}}
</style></head><body><header><div style="max-width:920px;margin:auto"><div class="small">READ · LISTEN · SPEAK · WRITE</div><h1>🌍 LingoStories</h1><p>Học Anh · Tây Ban Nha · Trung · Đức — theo nhịp của bạn</p></div></header><main class="wrap"><nav class="nav" id="nav"><button data-page="home" class="on">🏠<br>Trang chủ</button><button data-page="read">📖<br>Đọc truyện</button><button data-page="speak">🎙️<br>Luyện nói</button><button data-page="write">✍️<br>Viết Hán</button><button data-page="progress">📊<br>Tiến độ</button></nav><div id="app"></div><footer>LingoStories · Phiên bản học cá nhân · Dữ liệu lưu trên thiết bị</footer></main><script>
const DB={en:{name:'Tiếng Anh',flag:'🇬🇧',locale:'en-US',stories:[{title:'The Mysterious Notebook',level:'B1',lines:[['On a rainy morning, Maya found a notebook on the bus.','Vào một sáng mưa, Maya tìm thấy một cuốn sổ trên xe buýt.'],['There was no name on the cover, only a tiny drawing of a blue door.','Không có tên trên bìa, chỉ có hình vẽ một cánh cửa xanh nhỏ.'],['She opened it and read a surprising sentence.','Cô mở ra và đọc được một câu đáng ngạc nhiên.'],['“If you are reading this, you have already found the first clue.”','“Nếu bạn đang đọc điều này, bạn đã tìm thấy manh mối đầu tiên.”'],['Maya looked up, but the bus was almost empty.','Maya ngẩng lên, nhưng xe buýt gần như trống không.']],question:'What was drawn on the notebook?',answers:['A blue door','A red tree','A small cat'],correct:0},{title:'A Different Saturday',level:'B1',lines:[['Leo had planned to stay home and do nothing.','Leo đã định ở nhà và không làm gì cả.'],['Then his neighbor invited him to a small art exhibition.','Sau đó hàng xóm mời anh đến một triển lãm nghệ thuật nhỏ.'],['He almost said no, but decided to go.','Anh suýt từ chối, nhưng rồi quyết định đi.'],['One painting reminded him of a place he had visited as a child.','Một bức tranh khiến anh nhớ tới nơi từng đến hồi nhỏ.'],['By the end of the day, he had made a new friend.','Cuối ngày, anh đã có thêm một người bạn mới.']],question:'Where did Leo go?',answers:['To the cinema','To an art exhibition','To a restaurant'],correct:1}]},es:{name:'Tiếng Tây Ban Nha',flag:'🇪🇸',locale:'es-ES',stories:[{title:'El cuaderno perdido',level:'A2–B1',lines:[['Una mañana de lluvia, Ana encontró un cuaderno en el autobús.','Một sáng mưa, Ana tìm thấy một cuốn sổ trên xe buýt.'],['En la portada había un dibujo de una puerta azul.','Trên bìa có hình vẽ một cánh cửa xanh.'],['Ana abrió el cuaderno y leyó la primera página.','Ana mở cuốn sổ và đọc trang đầu tiên.'],['«Todo empieza con una pequeña pregunta», decía.','“Mọi chuyện bắt đầu bằng một câu hỏi nhỏ”, dòng chữ viết.'],['Ana decidió buscar al dueño del cuaderno.','Ana quyết định tìm chủ nhân cuốn sổ.']],question:'¿Qué había en la portada?',answers:['Una puerta azul','Un árbol rojo','Un gato negro'],correct:0},{title:'Un sábado diferente',level:'A2–B1',lines:[['Pablo quería quedarse en casa el sábado.','Pablo muốn ở nhà vào thứ Bảy.'],['Su amiga lo invitó a una exposición de arte.','Bạn anh mời anh đến một triển lãm nghệ thuật.'],['Al principio, Pablo no quería ir.','Ban đầu Pablo không muốn đi.'],['Pero vio un cuadro precioso y empezó a sonreír.','Nhưng anh thấy một bức tranh rất đẹp và bắt đầu mỉm cười.'],['Al final, pasó una tarde maravillosa.','Cuối cùng anh đã có một buổi chiều tuyệt vời.']],question:'¿Adónde fue Pablo?',answers:['A la escuela','A una exposición','Al hospital'],correct:1}]},de:{name:'Tiếng Đức',flag:'🇩🇪',locale:'de-DE',stories:[{title:'Ein Brief im Café',level:'A1–A2',lines:[['Jeden Morgen geht Lena in ein kleines Café.','Mỗi sáng Lena đến một quán cà phê nhỏ.'],['Heute liegt ein Brief auf ihrem Tisch.','Hôm nay có một lá thư trên bàn của cô.'],['Auf dem Umschlag steht kein Name.','Trên phong bì không có tên.'],['Lena öffnet den Brief und liest eine kurze Nachricht.','Lena mở thư và đọc một lời nhắn ngắn.'],['„Komm morgen wieder. Ich habe eine Überraschung für dich.“','“Ngày mai hãy quay lại. Tôi có một bất ngờ dành cho bạn.”']],question:'Was findet Lena auf dem Tisch?',answers:['Einen Brief','Ein Handy','Eine Blume'],correct:0},{title:'Ein unerwarteter Ausflug',level:'A2–B1',lines:[['Am Samstag wollte Jonas eigentlich zu Hause bleiben.','Thứ Bảy Jonas vốn định ở nhà.'],['Seine Freundin fragte ihn, ob er mit ins Museum kommen möchte.','Bạn anh hỏi liệu anh có muốn cùng đến bảo tàng không.'],['Zuerst hatte er keine Lust, aber dann sagte er doch zu.','Ban đầu anh không hứng thú, nhưng cuối cùng vẫn đồng ý.'],['Im Museum entdeckte er ein Bild aus seiner Heimatstadt.','Ở bảo tàng, anh phát hiện một bức tranh về quê mình.'],['Plötzlich erinnerte er sich an einen besonderen Tag aus seiner Kindheit.','Bỗng anh nhớ đến một ngày đặc biệt thời thơ ấu.']],question:'Wohin geht Jonas?',answers:['Ins Kino','Ins Museum','In die Bibliothek'],correct:1}]},zh:{name:'Tiếng Trung',flag:'🇨🇳',locale:'zh-CN',stories:[{title:'我的一天',level:'Nhập môn',lines:[['你好！','Xin chào!','Nǐ hǎo!'],['我叫小明。','Tôi tên là Tiểu Minh.','Wǒ jiào Xiǎomíng.'],['今天我去学校。','Hôm nay tôi đến trường.','Jīntiān wǒ qù xuéxiào.'],['我喜欢看书。','Tôi thích đọc sách.','Wǒ xǐhuan kàn shū.'],['晚上我回家。','Buổi tối tôi về nhà.','Wǎnshang wǒ huí jiā.']],question:'小明喜欢做什么？',answers:['看书','喝茶','跑步'],correct:0},{title:'去书店',level:'HSK 1–2',lines:[['今天我去书店。','Hôm nay tôi đến hiệu sách.','Jīntiān wǒ qù shūdiàn.'],['书店里有很多书。','Trong hiệu sách có nhiều sách.','Shūdiàn lǐ yǒu hěn duō shū.'],['我想买一本中文书。','Tôi muốn mua một cuốn sách tiếng Trung.','Wǒ xiǎng mǎi yì běn Zhōngwén shū.'],['这本书很好看。','Cuốn sách này rất hay.','Zhè běn shū hěn hǎokàn.'],['我买了书，然后回家。','Tôi mua sách rồi về nhà.','Wǒ mǎi le shū, ránhòu huí jiā.']],question:'他想买什么？',answers:['一本中文书','一杯水','一张票'],correct:0}]}},CHARS=[{c:'一',p:'yī',v:'một',strokes:'1 nét ngang, trái sang phải'},{c:'二',p:'èr',v:'hai',strokes:'2 nét ngang, trên trước dưới sau'},{c:'三',p:'sān',v:'ba',strokes:'3 nét ngang, từ trên xuống'},{c:'十',p:'shí',v:'mười',strokes:'ngang trước, sổ dọc sau'},{c:'人',p:'rén',v:'người',strokes:'phẩy trái trước, mác phải sau'},{c:'口',p:'kǒu',v:'miệng',strokes:'sổ trái; ngang gập phải; ngang đáy'},{c:'大',p:'dà',v:'to',strokes:'ngang; phẩy trái; mác phải'},{c:'小',p:'xiǎo',v:'nhỏ',strokes:'móc dọc giữa; chấm trái; chấm phải'}];
let state={page:'home',lang:'en',story:0,seen:{en:[],es:[],zh:[],de:[]},completed:{en:[],es:[],zh:[],de:[]},saved:[],showTranslation:false,showPinyin:true,character:0,minutes:45,practice:0,notes:[],xp:0};try{state={...state,...JSON.parse(localStorage.getItem('trilingo-stories-v2')||'{}')}}catch{};for(const k of Object.keys(DB)){if(!Array.isArray(state.seen?.[k])){state.seen=state.seen||{};state.seen[k]=[]}if(!Array.isArray(state.completed?.[k])){state.completed=state.completed||{};state.completed[k]=[]}}if(!DB[state.lang])state.lang='en';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem('trilingo-stories-v2',JSON.stringify(state))}catch{}}function set(p){Object.assign(state,p);persist();render()}function speech(t,rate=.85){if(!('speechSynthesis'in window))return alert('Trình duyệt không hỗ trợ đọc tiếng.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=DB[state.lang].locale;u.rate=rate;speechSynthesis.speak(u)}function langChips(){return '<div class="chips">'+Object.keys(DB).map(k=>`<button class="btn chip ${k===state.lang?'on':''}" data-lang="${k}">${DB[k].flag} ${DB[k].name}</button>`).join('')+'</div>'}function current(){return DB[state.lang].stories[state.story]}function count(){return Object.values(state.completed).reduce((n,x)=>n+x.length,0)}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===state.page));app.innerHTML=({home:home,read:read,speak:speak,write:write,progress:progress}[state.page])();if(state.page==='write')setupCanvas()}
function home(){const d=new Date().getDay(),rot=['de','zh','es','de','zh','es','de'][d],en=Math.round(state.minutes/3);return `<div class="card"><div class="label">Hôm nay</div><h2 style="margin:8px 0">Học theo nhịp của bạn</h2><div class="row wraprow"><span>Thời lượng mỗi ngày</span><select id="minutes">${[30,45,60].map(n=>`<option ${state.minutes===n?'selected':''} value="${n}">${n} phút</option>`).join('')}</select></div><p>🇬🇧 Tiếng Anh: <b>${en} phút</b> · ${DB[rot].flag} ${DB[rot].name}: <b>${state.minutes-en} phút</b></p><button class="btn primary" data-page="read">Bắt đầu đọc truyện →</button></div><div class="grid">${Object.entries(DB).map(([k,v])=>`<button class="tile" data-open-lang="${k}"><div style="font-size:27px">${v.flag}</div><b>${v.name}</b><span class="small muted">${k==='en'?'Đọc và shadowing':k==='es'?'Đọc và phản xạ nói':'Pinyin · đọc · viết chữ Hán'}</span><p class="small">${state.completed[k].length}/${v.stories.length} truyện hoàn thành</p></button>`).join('')}</div><div class="card"><b>Tiến độ</b><p>⭐ ${state.xp} XP · 📚 ${count()} truyện · 🔖 ${state.saved.length} câu đã lưu</p><p class="muted small">Bài học và tiến độ được lưu trong trình duyệt của thiết bị đang dùng.</p></div>`}
function read(){let s=current(),seen=state.seen[state.lang]||[],isDone=state.completed[state.lang].includes(state.story);return `${langChips()}<div class="card"><div class="row wraprow"><div><div class="label">Thư viện truyện</div><h2 style="margin:5px 0">${esc(s.title)}</h2><div class="small muted">${esc(s.level)} · ${s.lines.length} câu</div></div><select id="storySelect">${DB[state.lang].stories.map((v,i)=>`<option value="${i}" ${i===state.story?'selected':''}>Truyện ${i+1}: ${esc(v.title)}</option>`).join('')}</select></div><p class="small muted">Đã xem ${seen.length}/${s.lines.length} câu ${isDone?'· ✓ Đã hoàn thành':''}</p><div class="progress"><span style="width:${seen.length/s.lines.length*100}%"></span></div><div class="chips" style="margin-top:12px"><button class="btn" id="toggleTranslation">${state.showTranslation?'✓':'○'} Bản dịch</button>${state.lang==='zh'?`<button class="btn" id="togglePinyin">${state.showPinyin?'✓':'○'} Pinyin</button>`:''}<button class="btn" id="listenAll">🔊 Nghe truyện</button></div></div><div class="card"><div class="label">Chạm vào từng câu để nghe và xem nghĩa</div>${s.lines.map((l,i)=>`<button class="sentence" data-line="${i}"><span class="muted small">${i+1}. </span><span class="${state.lang==='zh'?'word':''}">${esc(l[0])}</span>${state.lang==='zh'&&state.showPinyin?`<div class="pinyin small">${esc(l[2])}</div>`:''}${state.showTranslation?`<div class="small muted">${esc(l[1])}</div>`:''}</button>`).join('')}</div><div id="detail"></div><div class="card"><h3>Kiểm tra đọc hiểu</h3><p>${esc(s.question)}</p>${s.answers.map((a,i)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:7px 0" data-answer="${i}">${esc(a)}</button>`).join('')}<div id="feedback" class="small"></div></div>`}
function speak(){let lines=DB[state.lang].stories[state.story].lines,i=state.practice%lines.length,l=lines[i];return `${langChips()}<div class="card"><div class="label">${state.lang==='es'?'Phản xạ nói tiếng Tây Ban Nha':state.lang==='en'?'Shadowing tiếng Anh':state.lang==='de'?'Shadowing và phản xạ tiếng Đức':'Nghe và nhắc lại tiếng Trung'}</div><h2>${['es','de'].includes(state.lang)?'Nghe · trả lời · nói lại':'Nghe · nhắc lại · luyện nhịp'}</h2><p class="muted small">Câu ${i+1}/${lines.length} · ${esc(current().title)}</p><div class="prompt"><div class="word">${esc(l[0])}</div>${state.lang==='zh'?`<p class="pinyin">${esc(l[2])}</p>`:''}<div class="muted small">${esc(l[1])}</div></div><div class="chips" style="margin-top:12px"><button class="btn" id="listenSlow">🔊 Chậm 0.7×</button><button class="btn" id="listenNormal">🔊 Bình thường</button><button class="btn" id="speakTry">🎙️ Nói thử</button></div><p id="spoken" class="muted small">Hãy nghe và nói theo. Tính năng micro tùy thuộc trình duyệt và quyền truy cập.</p><div class="row"><button class="btn" id="prevPractice">← Trước</button><button class="btn primary" id="nextPractice">Câu tiếp →</button></div></div>${['es','de'].includes(state.lang)?`<div class="card"><h3>Phản xạ tự do</h3><p>${state.lang==='de'?'Was hast du heute gemacht? — Hôm nay bạn đã làm gì?':'¿Qué hiciste hoy? — Hôm nay bạn đã làm gì?'}</p><p class="muted small">Hãy trả lời ngay bằng tiếng Tây Ban Nha trước khi xem mẫu.</p><button class="btn" id="showExample">Xem câu trả lời gợi ý</button><p id="example" class="hide">${state.lang==='de'?'Heute habe ich gearbeitet und danach eine Geschichte gelesen.':'Hoy he trabajado un poco y después he leído una historia.'}</p></div>`:''}`}
let strokes=[],currentStroke=null,showGuide=true;function write(){let h=CHARS[state.character];return `<div class="card"><div class="label">Tiếng Trung từ số 0</div><h2>Học viết chữ Hán</h2><p class="muted small">Bài ${state.character+1}/${CHARS.length} · Chữ giản thể · Có thể dùng ngón tay hoặc Apple Pencil</p><div class="row"><div><div class="han">${h.c}</div><b>${h.p}</b> · ${h.v}</div><div style="max-width:60%"><b>Thứ tự nét</b><p class="small muted">${h.strokes}</p><button class="btn" id="hearHan">🔊 Nghe</button></div></div><p class="small">Tập viết trong khung:</p><canvas id="ink" width="500" height="500"></canvas><div class="chips" style="margin-top:12px"><button class="btn" id="clearInk">Xóa nét</button><button class="btn" id="toggleGuide">${showGuide?'Ẩn':'Hiện'} chữ mẫu</button><button class="btn primary" id="nextChar">Chữ tiếp →</button></div><p class="muted small">Bản đầu hỗ trợ viết tay và hướng dẫn thứ tự nét bằng chữ; chưa có hoạt ảnh nét hay chấm điểm tự động.</p></div><div class="card"><h3>Nhập môn Pinyin và 4 thanh điệu</h3><p>Chạm vào từng âm để nghe cách lên xuống của thanh điệu.</p><div class="chips">${[['mā','Thanh 1: cao, ngang'],['má','Thanh 2: đi lên'],['mǎ','Thanh 3: hạ rồi lên'],['mà','Thanh 4: hạ mạnh']].map(([t,n])=>`<button class="btn" data-tone="${t}" title="${n}">${t}</button>`).join('')}</div><p id="toneExplain" class="small muted">Thanh nhẹ cũng cần học ở các bài tiếp theo.</p></div>`}
function progress(){return `<div class="card"><h2>Tiến độ học</h2><p>⭐ ${state.xp} XP · ${count()} truyện đã hoàn thành</p>${Object.entries(DB).map(([k,v])=>`<div style="margin:18px 0"><div class="row"><b>${v.flag} ${v.name}</b><span class="small">${state.completed[k].length}/${v.stories.length} truyện</span></div><div class="progress"><span style="width:${state.completed[k].length/v.stories.length*100}%"></span></div></div>`).join('')}</div><div class="card"><h3>🔖 Câu đã lưu (${state.saved.length})</h3>${state.saved.length?state.saved.map((x,i)=>`<div style="border-bottom:1px solid #edf0f5;padding:10px 0"><b>${esc(x.text)}</b><div class="small muted">${esc(x.meaning)}</div><button class="btn small" data-remove="${i}">Bỏ lưu</button></div>`).join(''):'<p class="muted">Bạn chưa lưu câu nào.</p>'}</div><div class="card"><h3>Sao lưu và chuyển dữ liệu</h3><p class="small muted">Bạn có thể xuất dữ liệu từ thiết bị này rồi nhập trên thiết bị kia. Đây là sao lưu thủ công, không phải đồng bộ tự động.</p><div class="chips"><button class="btn" id="exportData">⬇ Xuất dữ liệu</button><label class="btn" for="importData">⬆ Nhập dữ liệu</label><input type="file" id="importData" accept="application/json" class="hide"></div></div>`}
function setupCanvas(){const c=document.getElementById('ink');if(!c)return;const x=c.getContext('2d');function paint(){x.fillStyle='#fff';x.fillRect(0,0,500,500);x.strokeStyle='#d6dce6';x.lineWidth=1;x.setLineDash([7,7]);x.beginPath();x.moveTo(250,0);x.lineTo(250,500);x.moveTo(0,250);x.lineTo(500,250);x.stroke();x.setLineDash([]);if(showGuide){x.fillStyle='#e5e9f0';x.font='340px "Noto Sans CJK SC","Microsoft YaHei",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(CHARS[state.character].c,250,252)}x.strokeStyle='#273f63';x.lineWidth=12;x.lineJoin='round';x.lineCap='round';for(const stroke of strokes){if(!stroke.length)continue;x.beginPath();x.moveTo(...stroke[0]);for(let j=1;j<stroke.length;j++)x.lineTo(...stroke[j]);if(stroke.length===1)x.lineTo(stroke[0][0]+.1,stroke[0][1]+.1);x.stroke()}}function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*500/r.width,(e.clientY-r.top)*500/r.height]}c.addEventListener('pointerdown',e=>{e.preventDefault();currentStroke=[pos(e)];strokes.push(currentStroke);c.setPointerCapture(e.pointerId);paint()});c.addEventListener('pointermove',e=>{if(!currentStroke)return;currentStroke.push(pos(e));paint()});c.addEventListener('pointerup',()=>currentStroke=null);c.addEventListener('pointercancel',()=>currentStroke=null);window.repaintInk=paint;paint()}
function showLine(i){let l=current().lines[i];let arr=state.seen[state.lang]||[];if(!arr.includes(i)){arr.push(i);state.seen[state.lang]=arr;persist()}document.querySelectorAll('[data-line]').forEach(b=>b.classList.toggle('on',+b.dataset.line===i));let d=document.getElementById('detail');d.innerHTML=`<div class="card"><div class="label">Câu ${i+1}</div><p class="word">${esc(l[0])}</p>${l[2]?`<p class="pinyin">${esc(l[2])}</p>`:''}<p>${esc(l[1])}</p><div class="chips"><button class="btn" id="hearLine">🔊 Nghe câu</button><button class="btn" id="saveLine">☆ Lưu câu</button></div></div>`;d.dataset.line=i;speech(l[0],.8)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){set({page:b.dataset.page});return}if(b.dataset.lang){set({lang:b.dataset.lang,story:0,practice:0});return}if(b.dataset.openLang){set({lang:b.dataset.openLang,story:0,page:'read'});return}if(b.dataset.line!==undefined){showLine(+b.dataset.line);return}if(b.dataset.answer!==undefined){let s=current(),ok=+b.dataset.answer===s.correct;document.getElementById('feedback').textContent=ok?'✓ Chính xác!':'Chưa đúng, hãy đọc lại truyện.';if(ok&&!state.completed[state.lang].includes(state.story)){state.completed[state.lang].push(state.story);state.xp+=30;persist()}return}if(b.dataset.tone){let names={'mā':'Thanh 1: cao và ngang','má':'Thanh 2: đi lên','mǎ':'Thanh 3: hạ rồi lên','mà':'Thanh 4: hạ nhanh xuống'};document.getElementById('toneExplain').textContent=names[b.dataset.tone];speech(b.dataset.tone,.7);return}switch(b.id){case 'toggleTranslation':set({showTranslation:!state.showTranslation});break;case 'togglePinyin':set({showPinyin:!state.showPinyin});break;case 'listenAll':speech(current().lines.map(x=>x[0]).join(' '),.8);break;case 'hearLine':speech(current().lines[+document.getElementById('detail').dataset.line][0],.75);break;case 'saveLine':{let l=current().lines[+document.getElementById('detail').dataset.line];if(!state.saved.some(x=>x.lang===state.lang&&x.text===l[0])){state.saved.push({lang:state.lang,text:l[0],meaning:l[1]});state.xp+=2;persist()}b.textContent='★ Đã lưu';break}case 'listenSlow':speech(current().lines[state.practice%current().lines.length][0],.7);break;case 'listenNormal':speech(current().lines[state.practice%current().lines.length][0],1);break;case 'nextPractice':set({practice:(state.practice+1)%current().lines.length});break;case 'prevPractice':set({practice:(state.practice-1+current().lines.length)%current().lines.length});break;case 'showExample':document.getElementById('example').classList.toggle('hide');break;case 'speakTry':{let R=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.getElementById('spoken');if(!R){el.textContent='Thiết bị/trình duyệt này chưa hỗ trợ nhận dạng giọng nói.';break}try{let r=new R();r.lang=DB[state.lang].locale;r.onresult=v=>el.textContent='Bạn đã nói: '+v.results[0][0].transcript;r.onerror=()=>el.textContent='Không thể nhận dạng âm thanh; kiểm tra quyền micro.';el.textContent='Đang nghe...';r.start()}catch{el.textContent='Không thể mở micro trong môi trường này.'}break}case 'hearHan':{let u=new SpeechSynthesisUtterance(CHARS[state.character].c);u.lang='zh-CN';u.rate=.7;speechSynthesis.speak(u);break}case 'clearInk':strokes=[];window.repaintInk?.();break;case 'toggleGuide':showGuide=!showGuide;render();break;case 'nextChar':strokes=[];set({character:(state.character+1)%CHARS.length});break;case 'exportData':{let blob=new Blob([JSON.stringify({version:2,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trilingo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'savePractice':break;}});
document.addEventListener('change',e=>{if(e.target.id==='storySelect')set({story:+e.target.value,practice:0});if(e.target.id==='minutes')set({minutes:+e.target.value});if(e.target.id==='importData'){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let j=JSON.parse(t);if(j.version!==2||!j.state||!j.state.completed||!j.state.seen)throw Error('Sai định dạng');state={...state,...j.state,page:'progress'};persist();render();alert('Đã nhập dữ liệu thành công.')}).catch(()=>alert('Không đọc được tệp sao lưu.'))}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
